name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  npm:
    name: publish-to-npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: npm install -g npm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npm
        # A brand-new package can neither be staged nor use trusted publishing,
        # so the first version is published with a token. TODO: remove after the first release.
        run: |
          if npm view hono-jev-router version > /dev/null 2>&1; then
            npm stage publish --provenance --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
